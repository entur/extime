common:
  env: prd
  replicas: 1
  container:
    forceReplicas: 1

# Keep this outside 02:00-03:00, the hour Europe/Oslo repeats on the DST fall-back night. Spring's cron
# fires twice inside it, where quartz fired once, which would export and notify marduk twice.
avinorTimetableSchedulerCron: 0+58+3+*+*+?
gcp:
  bucketName:
    marduk: marduk-production
    mardukExchange: marduk-exchange-production
  blobstoreProjectId: ent-marduk-prd
  pubsubProjectId: ent-marduk-prd

